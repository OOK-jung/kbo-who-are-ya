<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KBO Who Are Ya? - 야구 선수 맞히기</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Pretendard', -apple-system, sans-serif;
      background-color: #121213;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    h1 { margin-bottom: 5px; color: #38bdf8; }
    p.sub { color: #a1a1aa; font-size: 14px; margin-bottom: 25px; }

    /* 검색창 영역 */
    .search-container { position: relative; width: 100%; max-width: 400px; margin-bottom: 30px; }
    input[type="text"] {
      width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid #3f3f46;
      background-color: #27272a; color: white; font-size: 16px; outline: none;
    }
    input[type="text"]:focus { border-color: #38bdf8; }
    
    .dropdown {
      position: absolute; top: 100%; left: 0; right: 0;
      background-color: #27272a; border: 1px solid #3f3f46; border-radius: 8px;
      max-height: 200px; overflow-y: auto; z-index: 10; display: none; margin-top: 5px;
    }
    .dropdown-item {
      padding: 10px 16px; cursor: pointer; border-bottom: 1px solid #3f3f46;
      display: flex; justify-content: space-between; align-items: center;
    }
    .dropdown-item:hover { background-color: #3f3f46; }
    .dropdown-item span.team { font-size: 12px; color: #a1a1aa; }

    /* 추측한 기록 보드 */
    .board { width: 100%; max-width: 700px; display: flex; flex-direction: column; gap: 10px; }
    .row { display: grid; grid-template-columns: 1.2fr repeat(6, 1fr); gap: 6px; text-align: center; }
    
    .tile {
      padding: 12px 4px; border-radius: 6px; font-weight: bold; font-size: 14px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 60px;
    }
    .player-name-tile { background-color: #27272a; border: 1px solid #3f3f46; }
    
    /* 판정 색상 스타일 */
    .status-correct { background-color: #15803d; color: white; } /* 초록색 (일치) */
    .status-incorrect { background-color: #3f3f46; color: white; } /* 회색 (불일치) */
    .arrow { font-size: 11px; margin-top: 2px; }

    /* 성공 메시지 */
    .success-msg {
      background-color: #15803d; padding: 15px 25px; border-radius: 8px;
      font-weight: bold; margin-bottom: 20px; text-align: center; display: none;
    }
  </style>
</head>
<body>

  <h1>⚾ KBO Who Are Ya?</h1>
  <p class="sub">오늘의 KBO 선수를 맞혀보세요!</p>

  <div id="successMsg" class="success-msg">🎉 축하합니다! 정답을 맞히셨습니다!</div>

  <!-- 검색 입력창 -->
  <div class="search-container">
    <input type="text" id="searchInput" placeholder="선수 이름을 입력하세요..." autocomplete="off">
    <div id="dropdown" class="dropdown"></div>
  </div>

  <!-- 게임 결과 보드 -->
  <div class="board" id="gameBoard">
    <div class="row" style="font-weight: bold; color: #a1a1aa; font-size: 12px; margin-bottom: 5px;">
      <div>선수명</div>
      <div>소속팀</div>
      <div>포지션</div>
      <div>투구</div>
      <div>타석</div>
      <div>나이</div>
      <div>등번호</div>
    </div>
  </div>

  <script>
    let players = [];
    let targetPlayer = null;
    let isGameOver = false;

    // 1. JSON 파일 로드 및 게임 초기화
    async function initGame() {
      try {
        const response = await fetch('./kbo_players.json');
        players = await response.json();
        
        if (players.length === 0) {
          alert("kbo_players.json 파일이 비어있습니다.");
          return;
        }

        // 오늘 날짜 기반으로 정답 선수 지정 (모든 유저 동일 정답)
        const todayStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
        let hash = 0;
        for (let i = 0; i < todayStr.length; i++) {
          hash = (hash << 5) - hash + todayStr.charCodeAt(i);
          hash |= 0;
        }
        const targetIndex = Math.abs(hash) % players.length;
        targetPlayer = players[targetIndex];

        // 개발용 정답 콘솔 출력
        console.log("🎯 오늘의 정답 선수:", targetPlayer.name, targetPlayer);

      } catch (error) {
        console.error("데이터 로딩 실패:", error);
        alert("kbo_players.json 파일을 불러올 수 없습니다. 웹 서버 환경(Live Server 등)에서 실행해 주세요.");
      }
    }

    // 2. 유저 추측 vs 정답 비교 함수
    function comparePlayer(guess, target) {
      const compareNum = (g, t) => g === t ? 'correct' : (g < t ? 'higher' : 'lower');

      return {
        name: guess.name,
        team: { val: guess.team, status: guess.team === target.team ? 'correct' : 'incorrect' },
        position: { val: guess.position, status: guess.position === target.position ? 'correct' : 'incorrect' },
        throws: { val: guess.throws + '투', status: guess.throws === target.throws ? 'correct' : 'incorrect' },
        bats: { val: guess.bats + '타', status: guess.bats === target.bats ? 'correct' : 'incorrect' },
        age: { val: guess.age + '세', status: compareNum(guess.age, target.age) },
        backNumber: { val: 'No.' + guess.backNumber, status: compareNum(guess.backNumber, target.backNumber) },
        isCorrect: guess.id === target.id
      };
    }

    // 3. 비교 결과를 화면 타일로 그리기
    function renderRow(result) {
      const board = document.getElementById('gameBoard');
      const row = document.createElement('div');
      row.className = 'row';

      const createTile = (data, isNum = false) => {
        const div = document.createElement('div');
        div.className = 'tile';
        
        if (typeof data === 'string') {
          div.className += ' player-name-tile';
          div.innerText = data;
        } else {
          div.className += ` status-${data.status === 'correct' ? 'correct' : 'incorrect'}`;
          
          let text = data.val;
          if (data.status === 'higher') text += ' <span class="arrow">⬆️</span>';
          if (data.status === 'lower') text += ' <span class="arrow">⬇️</span>';
          div.innerHTML = text;
        }
        return div;
      };

      row.appendChild(createTile(result.name));
      row.appendChild(createTile(result.team));
      row.appendChild(createTile(result.position));
      row.appendChild(createTile(result.throws));
      row.appendChild(createTile(result.bats));
      row.appendChild(createTile(result.age));
      row.appendChild(createTile(result.backNumber));

      board.appendChild(row);

      if (result.isCorrect) {
        document.getElementById('successMsg').style.display = 'block';
        document.getElementById('searchInput').disabled = true;
        isGameOver = true;
      }
    }

    // 4. 검색창 자동완성 드롭다운 이벤트
    const searchInput = document.getElementById('searchInput');
    const dropdown = document.getElementById('dropdown');

    searchInput.addEventListener('input', (e) => {
      const keyword = e.target.value.trim();
      dropdown.innerHTML = '';

      if (!keyword || isGameOver) {
        dropdown.style.display = 'none';
        return;
      }

      const filtered = players.filter(p => p.name.includes(keyword)).slice(0, 5);

      if (filtered.length > 0) {
        dropdown.style.display = 'block';
        filtered.forEach(player => {
          const item = document.createElement('div');
          item.className = 'dropdown-item';
          item.innerHTML = `<span>${player.name}</span><span class="team">${player.team}</span>`;
          
          item.addEventListener('click', () => {
            const result = comparePlayer(player, targetPlayer);
            renderRow(result);
            
            searchInput.value = '';
            dropdown.style.display = 'none';
          });
          dropdown.appendChild(item);
        });
      } else {
        dropdown.style.display = 'none';
      }
    });

    // 실행
    initGame();
  </script>
</body>
</html>
