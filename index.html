<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KBO 선수 맞히기 게임</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      padding: 30px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #1f2937;
    }
    .profile-img {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 20px;
      border: 4px solid #3b82f6;
      background-color: #e5e7eb;
    }
    .info-list {
      background-color: #f9fafb;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
      text-align: left;
      font-size: 0.95rem;
      color: #374151;
    }
    .info-item {
      margin-bottom: 6px;
    }
    .info-item:last-child {
      margin-bottom: 0;
    }
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px;
      border: 2px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #3b82f6;
    }
    button {
      padding: 12px 18px;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #2563eb;
    }
    .hint-container {
      margin-top: 10px;
    }
    .btn-hint {
      background: none;
      border: none;
      color: #6b7280;
      font-size: 0.9rem;
      text-decoration: underline;
      cursor: pointer;
      padding: 5px;
    }
    .btn-hint:hover {
      color: #374151;
      background: none;
    }
    .answer-box {
      display: none;
      margin-top: 10px;
      padding: 10px;
      background-color: #fef3c7;
      border: 1px solid #f59e0b;
      border-radius: 8px;
      color: #92400e;
      font-weight: bold;
      font-size: 0.95rem;
    }
    .result-msg {
      margin-top: 10px;
      font-weight: bold;
      min-height: 24px;
    }
    .success { color: #10b981; }
    .error { color: #ef4444; }
  </style>
</head>
<body>

  <div class="card">
    <h1>⚾ KBO 선수 맞히기</h1>

    <!-- 선수 사진 -->
    <img id="playerImg" class="profile-img" src="" alt="선수 사진" />

    <!-- 선수 힌트 프로필 정보 -->
    <div class="info-list">
      <div class="info-item"><b>소속구단:</b> <span id="infoTeam">-</span></div>
      <div class="info-item"><b>포지션:</b> <span id="infoPosition">-</span></div>
      <div class="info-item"><b>투타:</b> <span id="infoHand">-</span></div>
      <div class="info-item"><b>등번호:</b> No.<span id="infoBackNum">-</span></div>
      <div class="info-item"><b>만 나이:</b> <span id="infoAge">-</span>세</div>
    </div>

    <!-- 💡 입력 영역 (Enter 키 이벤트 적용) -->
    <div class="input-group">
      <input 
        type="text" 
        id="playerInput" 
        placeholder="선수 이름을 입력하세요" 
        onkeydown="handleKeyDown(event)" 
        autocomplete="off"
      />
      <button onclick="checkAnswer()">제출</button>
    </div>

    <!-- 결과 메시지 -->
    <div id="resultMsg" class="result-msg"></div>

    <!-- 💡 정답 보기 영역 -->
    <div class="hint-container">
      <button id="showAnswerBtn" class="btn-hint" onclick="toggleAnswer()">
        💡 정답 보기
      </button>
      <div id="answerBox" class="answer-box"></div>
    </div>
  </div>

  <script>
    let playersData = [];
    let currentPlayer = null;

    // 1. JSON 파일 로드
    async function loadPlayersData() {
      try {
        const response = await fetch('kbo_players.json');
        playersData = await response.json();
        if (playersData.length > 0) {
          nextQuestion();
        }
      } catch (error) {
        console.error("선수 데이터 로드 실패:", error);
        document.getElementById('resultMsg').innerText = "데이터를 불러오지 못했습니다.";
      }
    }

    // 2. 다음 랜덤 문제 출제
    function nextQuestion() {
      // 정답 UI 및 입력창 초기화
      resetAnswerUI();

      const randomIndex = Math.floor(Math.random() * playersData.length);
      currentPlayer = playersData[randomIndex];

      // UI에 데이터 바인딩
      document.getElementById('playerImg').src = currentPlayer.photoUrl || 'https://via.placeholder.com/180';
      document.getElementById('infoTeam').innerText = currentPlayer.team;
      document.getElementById('infoPosition').innerText = currentPlayer.position;
      document.getElementById('infoHand').innerText = `${currentPlayer.throws}투${currentPlayer.bats}타`;
      document.getElementById('infoBackNum').innerText = currentPlayer.backNumber;
      document.getElementById('infoAge').innerText = currentPlayer.age;
    }

    // 💡 3. Enter 키 제출 처리 함수
    function handleKeyDown(event) {
      if (event.key === 'Enter') {
        checkAnswer();
      }
    }

    // 4. 정답 체크 함수
    function checkAnswer() {
      const inputElem = document.getElementById('playerInput');
      const resultMsg = document.getElementById('resultMsg');
      const userGuess = inputElem.value.trim();

      if (!userGuess) return;

      if (userGuess === currentPlayer.name) {
        resultMsg.className = "result-msg success";
        resultMsg.innerText = "🎉 정답입니다! 다음 문제로 이동합니다.";
        setTimeout(() => {
          nextQuestion();
        }, 1200);
      } else {
        resultMsg.className = "result-msg error";
        resultMsg.innerText = "❌ 틀렸습니다. 다시 시도해 보세요!";
      }
    }

    // 💡 5. 정답 보기/숨기기 토글 함수
    function toggleAnswer() {
      const answerBox = document.getElementById('answerBox');
      const showAnswerBtn = document.getElementById('showAnswerBtn');

      if (!currentPlayer) return;

      if (answerBox.style.display === 'none' || answerBox.style.display === '') {
        answerBox.innerText = `정답: ${currentPlayer.name} (${currentPlayer.team})`;
        answerBox.style.display = 'block';
        showAnswerBtn.innerText = '🙈 정답 숨기기';
      } else {
        answerBox.style.display = 'none';
        showAnswerBtn.innerText = '💡 정답 보기';
      }
    }

    // 6. 다음 문제 이동 시 정답 UI 초기화
    function resetAnswerUI() {
      document.getElementById('playerInput').value = '';
      document.getElementById('resultMsg').innerText = '';
      document.getElementById('resultMsg').className = 'result-msg';

      const answerBox = document.getElementById('answerBox');
      const showAnswerBtn = document.getElementById('showAnswerBtn');

      answerBox.style.display = 'none';
      answerBox.innerText = '';
      showAnswerBtn.innerText = '💡 정답 보기';
    }

    // 페이지 로드 시 시작
    window.onload = loadPlayersData;
  </script>
</body>
</html>
